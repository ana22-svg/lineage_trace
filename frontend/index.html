<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lineage Trace // Forensic Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/app.css?v=6" />
</head>
<body>
  <aside class="sidebar">
    <div>
      <div class="brand">
        <div class="brand-title">
          <span class="mark">✦</span>
          <strong>Lineage Trace</strong>
        </div>
        <button id="toggle-sidebar" class="sidebar-toggle-btn" title="Hide sidebar" aria-label="Toggle Sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
        </button>
      </div>
      <div class="eyebrow eyebrow-flex" id="toggle-nav-header">
        <span>FORENSIC DESKS</span>
        <button id="toggle-nav" class="nav-toggle-btn" title="Toggle navigation tabs">▾</button>
      </div>
      <nav>
        <a href="#overview" data-route="overview"><span class="nav-icon">▦</span><span>Landing &amp; Overview</span></a>
        <a href="#clusters" data-route="clusters"><span class="nav-icon">◎</span><span>Clusters Explorer</span></a>
        <a href="#lineage" data-route="lineage"><span class="nav-icon">⌘</span><span>Mutation River</span></a>
        <a href="#alerts" data-route="alerts"><span class="nav-icon">◎</span><span>Watchlists &amp; Alerts</span></a>
        <a href="#channels" data-route="channels"><span class="nav-icon">☵</span><span>Monitored Channels</span></a>
      </nav>
    </div>
  </aside>

  <div class="workspace">
    <header>
      <div class="header-left">
        <button id="expand-sidebar-btn" class="sidebar-toggle-btn header-toggle-btn" title="Show sidebar" aria-label="Show Sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
        </button>
      </div>
      <div class="header-actions">
        <input id="search" placeholder="Search claim hash, entity, source URL…" />
        <button id="new-watch">+ Watchlist</button>
      </div>
    </header>
    <main id="app"><div class="loading">Loading forensic desk…</div></main>
  </div>

  <div id="modal-container"></div>
  <script src="/assets/app.js?v=6" defer></script>
</body>
</html>
