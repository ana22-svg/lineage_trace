version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: lineage_trace_user
      POSTGRES_PASSWORD: lineage_trace_password
      POSTGRES_DB: lineage_trace_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://lineage_trace_user:lineage_trace_password@db:5432/lineage_trace_db
    env_file:
      - ./backend/.env
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build: 
      context: ./backend
    environment:
      - DATABASE_URL=postgresql+psycopg://lineage_trace_user:lineage_trace_password@db:5432/lineage_trace_db
    env_file:
      - ./backend/.env
    depends_on:
      - db
    # Runs the watchlist periodic scan job independently of the API traffic
    command: python -m app.services.watchlist_worker

  telegram:
    build:
      context: ./backend
    environment:
      - DATABASE_URL=postgresql+psycopg://lineage_trace_user:lineage_trace_password@db:5432/lineage_trace_db
    env_file:
      - ./backend/.env
    depends_on:
      - db
    command: python -m app.services.telegram_worker

volumes:
  pgdata:
